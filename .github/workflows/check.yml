name: Shared checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.22'
          enable-cache: false
      - name: Install reference FFmpeg and ffprobe
        run: python scripts/install_ffmpeg.py
      - name: Run the shared gate (Windows)
        if: runner.os == 'Windows'
        env:
          # Check the complete PR delta; push/manual runs use the local default.
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked scripts/check.py --require-pinned
      - name: Run the shared gate through make (Linux)
        if: runner.os == 'Linux'
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha }}
        run: make check CHECK_FLAGS=--require-pinned
