[project]
name = "cliprender"
version = "0.1.0"
description = "Local FFmpeg renderer for the shared v1 edit plan"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "pillow>=10.1,<13", "segno>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
# Only a plan with a module transition needs these; the renderer imports numpy lazily.
styles = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
cliprender = "cliprender.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
